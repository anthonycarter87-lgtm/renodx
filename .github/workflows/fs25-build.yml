name: FS25 addon

# Builds only the Farming Simulator 25 addon and uploads it as a downloadable artifact.
on:
  workflow_dispatch:
  push:
    branches: [fs25]
    paths:
      - "src/games/farmingsimulator25/**"
      - ".github/workflows/fs25-build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up shader tools
        shell: pwsh
        run: .\scripts\setup-dev-env.ps1 -Update -Tools dxc,slang,glslang

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64

      - name: Install ninja-build tool
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure build for amd64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Configure CMake (x64)
        run: cmake --preset clang-x64

      - name: Build FS25 addon
        run: cmake --build --preset clang-x64-release --target farmingsimulator25

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: renodx-farmingsimulator25
          path: |
            build/**/renodx-farmingsimulator25.addon64
          if-no-files-found: error
